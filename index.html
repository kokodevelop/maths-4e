/* ================= Progression (stockée dans ce navigateur) ================= */
const KEY="maths4e-progress-v1";
let prog={};
try{prog=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){prog={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(prog))}catch(e){}}
function keysOf(ch){
  const k=[];
  ch.qcm.forEach((_,i)=>k.push(`${ch.id}:q:${i}`));
  ch.exos.forEach((e,i)=>e.p.forEach((_,j)=>k.push(`${ch.id}:e:${i}:${j}`)));
  ch.pbs.forEach((e,i)=>e.p.forEach((_,j)=>k.push(`${ch.id}:p:${i}:${j}`)));
  return k;
}
function stat(ch,prefix){
  const ks=keysOf(ch).filter(k=>!prefix||k.startsWith(`${ch.id}:${prefix}:`));
  const done=ks.filter(k=>prog[k]===1).length;
  return {done,total:ks.length,pct:ks.length?Math.round(100*done/ks.length):0};
}

/* ================= Vérification des réponses ================= */
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a};
function clean(s){return s.replace(/\s+/g,"").replace(/[−–]/g,"-").replace(/,/g,".")}
function parseNum(raw){
  let s=clean(raw).replace(/^[a-z]+=/i,"").replace(/[^0-9.\/\-]+$/,"");
  if(!s) return null;
  const fr=s.match(/^(-?\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)$/);
  if(fr){const d=parseFloat(fr[2]);if(d===0)return null;return {v:parseFloat(fr[1])/d,fr:[+fr[1],+fr[2]]}}
  if(/^-?(\d+\.?\d*|\.\d+)$/.test(s)) return {v:parseFloat(s)};
  return null;
}
function parseExpr(src){
  let s=src.toLowerCase().replace(/\s+/g,"").replace(/[−–]/g,"-").replace(/[×·]/g,"*").replace(/÷/g,"/").replace(/,/g,".").replace(/²/g,"^2").replace(/³/g,"^3");
  s=s.replace(/^[a-z]\(x\)=|^[a-wyz]=/,"");
  if(!s||!/^[0-9x+\-*/().^]+$/.test(s)) throw new Error("car");
  let i=0;
  const expr=()=>{let f=term();while(s[i]==="+"||s[i]==="-"){const o=s[i++],g=term(),a=f;f=o==="+"?x=>a(x)+g(x):x=>a(x)-g(x)}return f};
  const term=()=>{let f=unary();for(;;){const c=s[i];
    if(c==="*"||c==="/"){i++;const g=unary(),a=f;f=c==="*"?x=>a(x)*g(x):x=>a(x)/g(x)}
    else if(c!==undefined&&/[0-9x.(]/.test(c)){const g=power(),a=f;f=x=>a(x)*g(x)}
    else break}return f};
  const unary=()=>{if(s[i]==="-"){i++;const g=unary();return x=>-g(x)}if(s[i]==="+"){i++;return unary()}return power()};
  const power=()=>{const b=primary();if(s[i]==="^"){i++;const e=unary();return x=>Math.pow(b(x),e(x))}return b};
  const primary=()=>{const c=s[i];
    if(c==="("){i++;const f=expr();if(s[i]!==")")throw new Error("par");i++;return f}
    if(c==="x"){i++;return x=>x}
    const mm=s.slice(i).match(/^(\d+\.?\d*|\.\d+)/);if(mm){i+=mm[0].length;const v=parseFloat(mm[0]);return()=>v}
    throw new Error("tok")};
  const fn=expr(); if(i!==s.length) throw new Error("end");
  return {fn,s};
}
function notReduced(s){
  // découpe en termes de premier niveau et vérifie qu'aucun degré n'apparaît deux fois
  const terms=[];let depth=0,cur="";
  for(const c of s){if(c==="(")depth++;if(c===")")depth--;if((c==="+"||c==="-")&&depth===0&&cur){terms.push(cur);cur=c==="-"?"-":""}else cur+=c}
  if(cur)terms.push(cur);
  const deg=t=>/x\^2|x\*x/.test(t)?2:/x/.test(t)?1:0;
  const seen={};for(const t of terms){const d=deg(t);if(seen[d])return true;seen[d]=1}
  return false;
}
function check(part,raw){
  if(!raw.trim()) return {st:"err",msg:"Écris ta réponse avant de vérifier."};
  if(part.t==="num"){
    const r=parseNum(raw);
    if(!r) return {st:"err",msg:"Écris un nombre, par exemple −3,5 ou 7/4."};
    const tol=part.tol??1e-9;
    const ok=Math.abs(r.v-part.a)<=tol+1e-9*Math.abs(part.a);
    if(!ok) return {st:"bad",msg:"Ce n'est pas la bonne valeur. Reprends ton calcul ou demande un indice."};
    if(part.irr&&r.fr&&gcd(r.fr[0],r.fr[1])!==1) return {st:"warn",msg:"La valeur est juste, mais la fraction n'est pas irréductible. Simplifie-la."};
    if(part.irr&&!r.fr&&!Number.isInteger(part.a)) return {st:"ok",msg:"Juste ! On attendait une fraction, mais l'écriture décimale est correcte."};
    return {st:"ok",msg:"Bravo, c'est juste !"};
  }
  if(part.t==="expr"){
    let u,e;
    try{u=parseExpr(raw);e=parseExpr(part.a)}catch(err){return {st:"err",msg:"Expression illisible. Utilise x, +, −, des parenthèses et ^2 (ou ²) pour le carré."}}
    const pts=[-2.3,0.7,1.9,3.1];
    const eq=pts.every(x=>{const a=u.fn(x),b=e.fn(x);return isFinite(a)&&Math.abs(a-b)<1e-7*(1+Math.abs(b))});
    if(!eq) return {st:"bad",msg:"Ton expression n'est pas égale à la bonne réponse. Vérifie les signes."};
    if(part.form==="dev"&&u.s.includes("(")) return {st:"warn",msg:"L'expression est égale, mais elle n'est pas développée : il reste des parenthèses."};
    if(part.form==="dev"&&notReduced(u.s)) return {st:"warn",msg:"L'expression est égale, mais elle n'est pas réduite : regroupe les termes semblables."};
    if(part.form==="fact"&&!u.s.includes("(")) return {st:"warn",msg:"L'expression est égale, mais elle n'est pas factorisée : écris-la comme un produit."};
    return {st:"ok",msg:"Bravo, c'est juste !"};
  }
  return {st:"err",msg:""};
}

    h+=`</div></section>`;
  }
  h+=`<div class="reset" id="resetZone"><span>Ta progression est enregistrée dans ce navigateur.</span><button class="linkbtn" id="resetBtn">Effacer ma progression</button></div>`;
  view.innerHTML=h;
  $("#resetBtn").onclick=()=>{
    $("#resetZone").innerHTML=`<span>Effacer toutes tes réponses ?</span><button class="dangerbtn" id="resetYes">Oui, effacer</button><button class="linkbtn" id="resetNo">Annuler</button>`;
    $("#resetYes").onclick=()=>{prog={};save();route()};
    $("#resetNo").onclick=()=>route();
  };
}

function badge(ch,p){const s=stat(ch,p);return `<span class="badge ${s.done===s.total?"full":""}">${s.done}/${s.total}</span>`}

function renderChapter(ch,tab){
  const i=CH.indexOf(ch),st=stat(ch);
  let h=`<header class="ch-head" style="--tc:${tc(ch)}"><span class="chip">Chapitre ${i+1} · ${THEMES[ch.theme].nom}</span>
  <h1>${ch.titre}</h1><p class="sub">${ch.sous}</p>
  <div class="overall"><div class="bar"><i style="width:${st.pct}%"></i></div><span style="color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums">${st.pct} % réussi</span></div></header>
  <nav class="tabs" aria-label="Parties du chapitre">`;
  for(const [k,l] of TABS){
    const b=k==="comprehension"?badge(ch,"q"):k==="exercices"?badge(ch,"e"):k==="problemes"?badge(ch,"p"):"";
    h+=`<a href="#${ch.id}-${k}" class="${k===tab?"on":""}">${l}${b}</a>`}
  h+=`</nav><div id="pane"></div>`;
  const prev=CH[i-1],next=CH[i+1];
  const ti=TABS.findIndex(t=>t[0]===tab);
  h+=`<div class="pager">`;
  if(ti>0) h+=`<a href="#${ch.id}-${TABS[ti-1][0]}"><small>← Étape précédente</small>${TABS[ti-1][1]}</a>`;
  else if(prev) h+=`<a href="#${prev.id}"><small>← Chapitre ${i}</small>${prev.titre}</a>`;
  if(ti<TABS.length-1) h+=`<a class="nx" href="#${ch.id}-${TABS[ti+1][0]}"><small>Étape suivante →</small>${TABS[ti+1][1]}</a>`;
  else if(next) h+=`<a class="nx" href="#${next.id}"><small>Chapitre ${i+2} →</small>${next.titre}</a>`;
  h+=`</div>`;
  view.innerHTML=h;
  const pane=$("#pane");
  if(tab==="cours") renderCours(ch,pane);
  else if(tab==="definitions") renderDefs(ch,pane);
  else if(tab==="comprehension") renderQcm(ch,pane);
  else if(tab==="exercices") renderExos(ch,pane,"e");
  else renderExos(ch,pane,"p");
}

function renderCours(ch,pane){
  pane.innerHTML=`<article class="lesson">${ch.cours.map((s,i)=>`<section><h3><span class="k">${String.fromCharCode(65+i)}.</span>${s.t}</h3>${s.h}</section>`).join("")}</article>`;
}

function renderDefs(ch,pane){
  pane.innerHTML=`<div class="defs-tools"><p>Essaie de te rappeler chaque définition, puis clique sur la carte pour vérifier.</p>
  <div class="row"><button class="btn" id="showAll">Tout afficher</button><button class="btn" id="hideAll">Tout masquer</button></div></div>
  <div class="defs">${ch.defs.map(d=>`<button class="dcard" aria-expanded="false"><span class="term">${d.t}</span><span class="hint">Afficher la définition</span>
  <span class="body"><p>${d.d}</p>${d.e?`<p class="e"><b>Exemple :</b> ${d.e}</p>`:""}</span></button>`).join("")}</div>`;
  pane.querySelectorAll(".dcard").forEach(c=>c.onclick=()=>{const on=c.classList.toggle("show");c.setAttribute("aria-expanded",on)});
  $("#showAll").onclick=()=>pane.querySelectorAll(".dcard").forEach(c=>{c.classList.add("show");c.setAttribute("aria-expanded",true)});
  $("#hideAll").onclick=()=>pane.querySelectorAll(".dcard").forEach(c=>{c.classList.remove("show");c.setAttribute("aria-expanded",false)});
}

function renderQcm(ch,pane){
  const s=stat(ch,"q");
  let h=`<p class="note">Une seule réponse est juste. Ta première réponse compte pour ton score.</p><div class="list">`;
  ch.qcm.forEach((q,i)=>{
    const k=`${ch.id}:q:${i}`,done=k in prog;
    h+=`<div class="item" data-i="${i}"><div class="lab"><span>Question ${i+1}</span>${done?`<span class="st" style="color:${prog[k]?"var(--ok)":"var(--bad)"}">${prog[k]?"Réussie":"Ratée au premier essai"}</span>`:""}</div>
    <div class="q">${q.q}</div><div class="opts">${q.o.map((o,j)=>`<button class="opt" data-j="${j}"><span class="L">${"ABCD"[j]}</span><span>${o}</span></button>`).join("")}</div><div class="fbz"></div></div>`;
  });
  h+=`</div>`;
  pane.innerHTML=h;
  pane.querySelectorAll(".item").forEach(it=>{
    const i=+it.dataset.i,q=ch.qcm[i],k=`${ch.id}:q:${i}`;
    const reveal=(j)=>{
      it.querySelectorAll(".opt").forEach(b=>{b.disabled=true;const bj=+b.dataset.j;if(bj===q.a)b.classList.add("good");else if(bj===j)b.classList.add("wrong")});
      const ok=j===q.a;
      it.querySelector(".fbz").innerHTML=`<div class="fb ${ok?"ok":"bad"}"><b>${ok?"Bonne réponse.":"Ce n'est pas la bonne réponse."}</b> <span class="ink">${q.e}</span></div>`;
    };
    if(k in prog && prog["sel:"+k]!==undefined) reveal(prog["sel:"+k]);
    it.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const j=+b.dataset.j;
      if(!(k in prog)){prog[k]=j===q.a?1:0;prog["sel:"+k]=j;save();refreshProgress(ch)}
      reveal(j);
    });
  });
}

function partHTML(p,key,j){
  const id=`in-${key.replace(/:/g,"-")}`;
  const solved=prog[key]===1;
  if(p.t==="ch"){
    return `<div class="part" data-k="${key}" data-j="${j}">${p.l?`<span class="pl">${p.l}</span>`:""}
    <div class="row">${p.o.map((o,oi)=>`<button class="opt chb" data-o="${oi}" style="min-width:90px">${o}</button>`).join("")}</div><div class="pfb" aria-live="polite"></div></div>`;
  }
  return `<div class="part" data-k="${key}" data-j="${j}">${p.l?`<label class="pl" for="${id}">${p.l}</label>`:""}
  <div class="row"><input id="${id}" type="text" autocomplete="off" spellcheck="false" ${p.t==="expr"?'inputmode="text" placeholder="ex : 3x^2 − 4x + 1"':'inputmode="decimal" placeholder="Ta réponse"'} class="${solved?"ok":""}" aria-label="${p.l?"":"Réponse"}">
  ${p.u?`<span class="unit">${p.u}</span>`:""}
  ${p.t==="expr"?`<span class="keys"><button type="button" data-ins="x">x</button><button type="button" data-ins="²">x²</button><button type="button" data-ins="(">(</button><button type="button" data-ins=")">)</button></span>`:""}
  <button class="btn primary vb">Vérifier</button></div><div class="pfb" aria-live="polite">${solved?"Déjà réussi.":""}</div></div>`;
}

function renderExos(ch,pane,kind){
  const items=kind==="e"?ch.exos:ch.pbs;
  let h=`<p class="note">${kind==="e"?"Exercices d'application. Les nombres décimaux s'écrivent avec une virgule ou un point ; les fractions avec / (ex : −3/4).":"Problèmes : lis tout l'énoncé avant de répondre. Les questions s'enchaînent."}${items.some(x=>x.p.some(p=>p.t==="expr"))?" Pour le carré, tape ^2 ou utilise le bouton x².":""}</p><div class="list">`;
  items.forEach((it,i)=>{
    h+=`<div class="item" data-i="${i}"><div class="lab"><span>${kind==="e"?"Exercice":"Problème"} ${i+1}</span><span class="st"></span></div>
    ${it.titre?`<h3>${it.titre}</h3>`:""}<div class="q">${it.q}</div><div class="parts">${it.p.map((p,j)=>partHTML(p,`${ch.id}:${kind}:${i}:${j}`,j)).join("")}</div>
    <div class="aids"><button class="btn hb">Indice</button><button class="btn sb">Voir la correction</button></div><div class="aidz"></div></div>`;
  });
  pane.innerHTML=h+"</div>";
  pane.querySelectorAll(".item").forEach(el=>{
    const it=items[+el.dataset.i];
    const upd=()=>{const all=it.p.every((_,j)=>prog[`${ch.id}:${kind}:${el.dataset.i}:${j}`]===1);el.querySelector(".st").textContent=all?"Réussi":""};
    upd();
    el.querySelectorAll(".part").forEach(pe=>{
      const p=it.p[+pe.dataset.j],k=pe.dataset.k,fb=pe.querySelector(".pfb");
      const show=r=>{fb.className="pfb "+r.st;fb.textContent=r.msg;if(r.st==="ok"){prog[k]=1;save();refreshProgress(ch);upd()}};
      if(p.t==="ch"){
        const btns=pe.querySelectorAll(".chb");
        if(prog[k]===1) btns.forEach(b=>{if(+b.dataset.o===p.a)b.classList.add("good")});
        btns.forEach(b=>b.onclick=()=>{
          btns.forEach(x=>x.classList.remove("good","wrong"));
          const ok=+b.dataset.o===p.a;b.classList.add(ok?"good":"wrong");
          show(ok?{st:"ok",msg:"Bravo, c'est juste !"}:{st:"bad",msg:"Non. Fais le calcul des carrés pour décider."});
        });
        return;
      }
      const inp=pe.querySelector("input");
      const go=()=>{const r=check(p,inp.value);inp.classList.toggle("ok",r.st==="ok");inp.classList.toggle("bad",r.st==="bad");show(r)};
      pe.querySelector(".vb").onclick=go;
      inp.addEventListener("keydown",e=>{if(e.key==="Enter")go()});
      pe.querySelectorAll("[data-ins]").forEach(b=>b.onclick=()=>{
        const t=b.dataset.ins,s=inp.selectionStart??inp.value.length,e=inp.selectionEnd??s;
        inp.value=inp.value.slice(0,s)+t+inp.value.slice(e);inp.focus();inp.setSelectionRange(s+t.length,s+t.length);
      });
    });
    const az=el.querySelector(".aidz");
    el.querySelector(".hb").onclick=()=>{if(!az.querySelector(".hint"))az.insertAdjacentHTML("afterbegin",`<div class="reveal hint"><b>Indice</b>${it.h}</div>`)};
    el.querySelector(".sb").onclick=()=>{if(!az.querySelector(".sol"))az.insertAdjacentHTML("beforeend",`<div class="reveal sol"><b>Correction</b>${it.s}</div>`)};
  });
}

function refreshProgress(ch){
  renderSide(ch.id);
  const st=stat(ch);
  const bar=view.querySelector(".ch-head .bar i");if(bar)bar.style.width=st.pct+"%";
  const lab=view.querySelector(".ch-head .overall span");if(lab)lab.textContent=st.pct+" % réussi";
  view.querySelectorAll(".tabs a").forEach(a=>{
    const k=a.getAttribute("href").split("-")[1];const p={comprehension:"q",exercices:"e",problemes:"p"}[k];
    if(p){const b=a.querySelector(".badge"),s=stat(ch,p);b.textContent=`${s.done}/${s.total}`;b.classList.toggle("full",s.done===s.total)}
  });
}

/* ================= Navigation ================= */
function route(){
  const h=location.hash.slice(1);
  const [id,tab]=h.split("-");
  const ch=CH.find(c=>c.id===id);
  closeMenu();
  if(!ch){renderSide(null);renderHome()}
  else{renderSide(ch.id);renderChapter(ch,TABS.some(t=>t[0]===tab)?tab:"cours")}
  window.scrollTo(0,0);
}
let scrim=null;
function openMenu(){side.classList.add("open");scrim=document.createElement("div");scrim.className="scrim";scrim.onclick=closeMenu;document.body.appendChild(scrim)}
function closeMenu(){side.classList.remove("open");if(scrim){scrim.remove();scrim=null}}
$("#menuBtn").onclick=()=>side.classList.contains("open")?closeMenu():openMenu();
window.addEventListener("hashchange",route);
route();
</script>
