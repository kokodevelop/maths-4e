<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maths 4e — Espace enseignant</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2545c4">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=STIX+Two+Text:wght@400;600&display=swap">
<style>
/* Layout : liste des classes à gauche, classe sélectionnée à droite (onglets Bilan / Élèves) */
:root{
  --paper:#f7f9fd; --surface:#ffffff; --ink:#17203a; --muted:#59627a; --line:#dbe2ef;
  --accent:#2545c4; --accent-ink:#ffffff; --accent-soft:#e7ecfc; --margin:#d9587a; --hl:#fff0a0; --hl-ink:#4d3f00;
  --ok:#17784a; --ok-soft:#e1f3e8; --bad:#b3343e; --bad-soft:#fbe6e7; --warn:#8a5a00; --warn-soft:#fdf1d8;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-math:"STIX Two Text","Cambria Math","Times New Roman",serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#10141e; --surface:#171c28; --ink:#e6eaf4; --muted:#9ba4b9; --line:#2a3245;
  --accent:#8ea4ff; --accent-ink:#0f1430; --accent-soft:#1d2647; --margin:#e57592; --hl:#4f4512; --hl-ink:#fff2b5;
  --ok:#5fd29a; --ok-soft:#132e20; --bad:#ff8b93; --bad-soft:#3a1a1e; --warn:#f2c066; --warn-soft:#352a12;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#10141e; --surface:#171c28; --ink:#e6eaf4; --muted:#9ba4b9; --line:#2a3245;
  --accent:#8ea4ff; --accent-ink:#0f1430; --accent-soft:#1d2647; --margin:#e57592; --hl:#4f4512; --hl-ink:#fff2b5;
  --ok:#5fd29a; --ok-soft:#132e20; --bad:#ff8b93; --bad-soft:#3a1a1e; --warn:#f2c066; --warn-soft:#352a12;
  color-scheme:dark;
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
a{color:var(--accent)}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--surface);border-bottom:1px solid var(--line);padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top .brand{font-family:var(--f-display);font-weight:800;font-size:1.3rem;text-decoration:none;color:var(--ink)}
.top .tag{font-size:.74rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--margin)}
.top .who{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:.92rem;color:var(--muted)}
.wrap{max-width:1240px;margin:0 auto;padding-block:24px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;font-weight:700;font-size:.9rem}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn:disabled{opacity:.6;cursor:not-allowed}
.linkbtn{background:none;border:none;color:var(--accent);text-decoration:underline;padding:0;font-size:.9rem}
.linkbtn.muted{color:var(--muted)}
input,textarea{font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:8px;padding:8px 12px}
input:focus,textarea:focus{border-color:var(--accent);outline:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.msg{min-height:1.3em;font-size:.92rem}
.msg.err{color:var(--bad)} .msg.ok{color:var(--ok)}
.muted{color:var(--muted)}
/* connexion */
.auth{max-width:440px;margin:40px auto;display:flex;flex-direction:column;gap:16px}
.auth form{display:flex;flex-direction:column;gap:12px}
.auth label{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:.92rem}
.switch{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.switch button{background:none;border:none;border-bottom:3px solid transparent;padding:8px 12px;font-weight:700;color:var(--muted)}
.switch button.on{color:var(--ink);border-bottom-color:var(--accent)}
/* espace */
.grid{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:1fr}}
.classes{display:flex;flex-direction:column;gap:6px}
.classes h2{font-size:1rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-family:var(--f-body)}
.cl{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.cl:hover{border-color:var(--accent)}
.cl.on{background:var(--accent-soft);border-color:var(--accent);font-weight:700}
.cl small{color:var(--muted);font-weight:400}
.newclass{display:flex;gap:6px;margin-top:8px}
.newclass input{flex:1;min-width:0}
.panel{display:flex;flex-direction:column;gap:16px;min-width:0}
.phead{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
.phead h1{font-size:clamp(1.6rem,3.5vw,2.2rem);font-weight:800}
.code{display:flex;flex-direction:column;align-items:flex-end}
.code span{font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.code b{font-family:var(--f-math);font-size:1.8rem;letter-spacing:.12em;background:var(--hl);color:var(--hl-ink);padding:0 10px;border-radius:6px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{flex:none;background:none;border:none;border-bottom:3px solid transparent;padding:10px 14px;font-weight:700;color:var(--muted)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.kpis{display:flex;flex-wrap:wrap;gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;min-width:150px}
.kpi span{display:block;font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.kpi b{font-family:var(--f-display);font-size:1.6rem;font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:.9rem;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
th{font-size:.76rem;color:var(--muted);font-weight:700;background:var(--paper);position:sticky;top:0}
td.l,th.l{text-align:left}
tbody tr:hover{background:var(--accent-soft)}
tr.clic{cursor:pointer}
.n{display:inline-block;min-width:3.2em;border-radius:6px;padding:1px 6px;font-weight:700}
.n.b{background:var(--bad-soft);color:var(--bad)} .n.w{background:var(--warn-soft);color:var(--warn)} .n.g{background:var(--ok-soft);color:var(--ok)}
.n.z{color:var(--muted);font-weight:400}
.flag{color:var(--bad);font-weight:700}
.legend{font-size:.84rem;color:var(--muted);margin:0}
.add{display:flex;flex-direction:column;gap:8px}
.add textarea{min-height:140px;width:100%;resize:vertical}
.pins{background:var(--hl);color:var(--hl-ink);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.pins table{background:var(--surface);color:var(--ink);border-radius:8px}
.pins .mono,.mono{font-family:var(--f-math);font-size:1.05rem;letter-spacing:.06em}
.acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.confirm{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--warn-soft);border-radius:6px;padding:4px 8px;font-size:.86rem;white-space:normal}
.detail{display:flex;flex-direction:column;gap:12px}
.detail h3{font-size:1.1rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.q{font-size:.8rem;border-radius:6px;padding:3px 8px;border:1px solid var(--line)}
.q.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.q.half{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.q.ko{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.empty{padding:28px;text-align:center;color:var(--muted)}
.howto{font-size:.9rem;background:var(--accent-soft);border-radius:var(--r);padding:12px 16px}
.howto b{color:var(--accent)}
@media print{.top,.classes,.tabs,.acts,.add,.noprint{display:none!important}.grid{display:block}.pins{background:none}}
</style>
</head>
<body>
<header class="top"><a class="brand" href="./">Maths 4e</a><span class="tag">Espace enseignant</span><div class="who" id="who"></div></header>
<main class="wrap" id="app"></main>

<script src="config.js"></script>
<script>
const API=(window.MATHS4E_API||"").replace(/\/+$/,"");
const PKEY="maths4e-prof";
const app=document.getElementById("app"), who=document.getElementById("who");
const $=s=>document.querySelector(s);
const esc=t=>String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=x=>(x===null||x===undefined)?"–":(Math.round(x*10)/10).toString().replace(".",",");
const dateUtc=s=>s?new Date(/[zZ]|[+-]\d\d:?\d\d$/.test(s)?s:s+"Z"):null;
function quand(s){
  const d=dateUtc(s);if(!d)return "jamais";
  const min=Math.round((Date.now()-d)/60000);
  if(min<2)return "à l'instant";if(min<60)return `il y a ${min} min`;
  const h=Math.round(min/60);if(h<24)return `il y a ${h} h`;
  return d.toLocaleDateString("fr-FR",{day:"numeric",month:"short"});
}
const noteCls=n=>n===null||n===undefined?"z":n<8?"b":n<12?"w":"g";
let etat={prof:null,classes:[],classe:null,onglet:"bilan",bilan:null,eleves:[],nouveaux:null,detail:null};
try{etat.prof=JSON.parse(localStorage.getItem(PKEY))}catch(e){}

async function api(m,chemin,corps){
  const r=await fetch(API+chemin,{method:m,headers:Object.assign({"Content-Type":"application/json"},etat.prof?{Authorization:"Bearer "+etat.prof.jeton}:{}),body:corps?JSON.stringify(corps):undefined});
  let d=null;try{d=await r.json()}catch(e){}
  if(r.status===401&&etat.prof){deconnecter();throw new Error("Session expirée. Reconnecte-toi.")}
  if(!r.ok)throw new Error((d&&d.erreur)||(r.status===429?"Trop de tentatives. Attends une minute.":"Erreur du serveur ("+r.status+")."));
  return d;
}
function deconnecter(){etat={prof:null,classes:[],classe:null,onglet:"bilan",bilan:null,eleves:[],nouveaux:null,detail:null};try{localStorage.removeItem(PKEY)}catch(e){}rendre()}

/* ---------- Connexion / inscription ---------- */
function vueAuth(mode){
  who.innerHTML="";
  if(!API){app.innerHTML=`<div class="auth card"><h1>API non configurée</h1><p>Renseigne l'adresse de l'API de suivi dans <b>config.js</b> (<code>window.MATHS4E_API</code>), puis recharge la page.</p></div>`;return}
  const insc=mode==="inscription";
  app.innerHTML=`<div class="auth"><div><h1>${insc?"Créer un compte enseignant":"Connexion enseignant"}</h1><p class="muted">Suis les résultats de tes élèves dans l'application Maths 4e.</p></div>
  <div class="switch"><button id="tConn" class="${insc?"":"on"}">Connexion</button><button id="tInsc" class="${insc?"on":""}">Créer un compte</button></div>
  <form class="card" id="fAuth" novalidate>
    ${insc?`<label for="aNom">Nom affiché<input id="aNom" autocomplete="name" placeholder="ex : Mme Kombar" required></label>`:""}
    <label for="aEmail">Adresse e-mail<input id="aEmail" type="email" autocomplete="email" required></label>
    <label for="aMdp">Mot de passe<input id="aMdp" type="password" autocomplete="${insc?"new-password":"current-password"}" minlength="8" required></label>
    ${insc?`<label for="aCode">Code d'invitation<input id="aCode" autocomplete="off" required><span class="muted" style="font-weight:400;font-size:.84rem">Donné par l'administrateur du serveur (Inscription:CodeInvitation).</span></label>`:""}
    <div class="msg err" id="aMsg" aria-live="polite"></div>
    <button class="btn primary" id="aBtn" type="submit">${insc?"Créer mon compte":"Se connecter"}</button>
  </form></div>`;
  $("#tConn").onclick=()=>vueAuth("connexion");
  $("#tInsc").onclick=()=>vueAuth("inscription");
  $("#fAuth").onsubmit=async e=>{
    e.preventDefault();const b=$("#aBtn");b.disabled=true;$("#aMsg").textContent="";
    try{
      const corps={email:$("#aEmail").value,motDePasse:$("#aMdp").value};
      if(insc){corps.nom=$("#aNom").value;corps.codeInvitation=$("#aCode").value}
      const d=await api("POST",`/api/auth/enseignant/${insc?"inscription":"connexion"}`,corps);
      etat.prof={jeton:d.jeton,nom:d.nom};try{localStorage.setItem(PKEY,JSON.stringify(etat.prof))}catch(err){}
      await chargerClasses();rendre();
    }catch(err){$("#aMsg").textContent=err.message==="Failed to fetch"?"Serveur injoignable.":err.message;b.disabled=false}
  };
}

/* ---------- Données ---------- */
async function chargerClasses(){etat.classes=await api("GET","/api/classes")}
async function ouvrirClasse(id){
  etat.classe=etat.classes.find(c=>c.id===id)||null;etat.nouveaux=null;etat.detail=null;
  rendre();
  if(!etat.classe)return;
  try{
    const [b,el]=await Promise.all([api("GET",`/api/classes/${id}/bilan`),api("GET",`/api/classes/${id}/eleves`)]);
    etat.bilan=b;etat.eleves=el;
  }catch(e){etat.bilan=null;etat.erreur=e.message}
  rendre();
}

/* ---------- Espace enseignant ---------- */
function rendre(){
  if(!etat.prof)return vueAuth("connexion");
  who.innerHTML=`<span>${esc(etat.prof.nom)}</span><button class="btn" id="deco">Se déconnecter</button>`;
  $("#deco").onclick=deconnecter;
  const c=etat.classe;
  app.innerHTML=`<div class="grid">
    <aside class="classes"><h2>Mes classes</h2>
      ${etat.classes.map(k=>`<button class="cl ${c&&c.id===k.id?"on":""}" data-id="${k.id}"><span>${esc(k.nom)}</span><small>${k.nbEleves} élève${k.nbEleves>1?"s":""}</small></button>`).join("")||`<p class="muted" style="margin:0">Aucune classe pour l'instant.</p>`}
      <form class="newclass" id="fClasse"><input id="nClasse" placeholder="Nouvelle classe (ex : 4e B)" maxlength="80" aria-label="Nom de la nouvelle classe"><button class="btn primary">Créer</button></form>
      <div class="msg err" id="cMsg"></div>
    </aside>
    <section class="panel" id="panel">${c?vueClasse(c):`<div class="card empty">Crée une classe ou sélectionne-la pour voir les résultats de tes élèves.</div>`}</section>
  </div>`;
  app.querySelectorAll(".cl").forEach(b=>b.onclick=()=>ouvrirClasse(+b.dataset.id));
  $("#fClasse").onsubmit=async e=>{
    e.preventDefault();const nom=$("#nClasse").value.trim();if(!nom)return;
    try{const k=await api("POST","/api/classes",{nom});await chargerClasses();ouvrirClasse(k.id)}catch(err){$("#cMsg").textContent=err.message}
  };
  if(c)brancherClasse(c);
}

function vueClasse(c){
  const appUrl=location.href.replace(/prof\.html.*$/,"");
  return `<div class="phead"><div><h1>${esc(c.nom)}</h1><span class="muted">${c.nbEleves} élève${c.nbEleves>1?"s":""}</span></div>
    <div class="code"><span>Code de la classe</span><b>${esc(c.code)}</b></div></div>
  <div class="howto noprint">Pour se connecter, chaque élève ouvre <b>${esc(appUrl)}</b>, touche <b>Se connecter à ma classe</b> et saisit le code <b>${esc(c.code)}</b>, son identifiant et son code PIN.</div>
  <nav class="tabs"><button data-o="bilan" class="${etat.onglet==="bilan"?"on":""}">Bilan</button><button data-o="eleves" class="${etat.onglet==="eleves"?"on":""}">Élèves</button><button data-o="classe" class="${etat.onglet==="classe"?"on":""}">Classe</button></nav>
  <div id="contenu">${etat.onglet==="bilan"?vueBilan():etat.onglet==="eleves"?vueEleves():vueReglages(c)}</div>`;
}

function vueBilan(){
  const b=etat.bilan;
  if(!b)return `<div class="card empty">${esc(etat.erreur||"Chargement…")}</div>`;
  if(!b.eleves.length)return `<div class="card empty">Aucun élève dans cette classe. Ajoute-les dans l'onglet <b>Élèves</b>.</div>`;
  const actifs=b.eleves.filter(e=>e.points>0).length;
  const corr=b.eleves.reduce((a,e)=>a+e.correctionsVues,0);
  if(etat.detail)return vueDetail();
  return `<div class="kpis"><div class="kpi"><span>Moyenne de la classe</span><b>${b.moyenneClasse===null?"–":fmt(b.moyenneClasse)+" / 20"}</b></div>
    <div class="kpi"><span>Élèves actifs</span><b>${actifs} / ${b.eleves.length}</b></div>
    <div class="kpi"><span>Corrections vues avant de trouver</span><b>${corr}</b></div></div>
  <div class="tbl"><table><thead><tr><th class="l">Élève</th><th>Note /20</th><th>Points</th><th>Indices</th><th>Corrections<br>vues</th><th>Dernière<br>activité</th>
    ${b.chapitres.map(ch=>`<th title="${esc(ch.titre)}">Ch.${ch.ordre}<br><span style="font-weight:400">${esc(ch.titre.split(" ").slice(-1)[0])}</span></th>`).join("")}</tr></thead>
  <tbody>${b.eleves.map(e=>`<tr class="clic" data-id="${e.id}" tabindex="0"><td class="l"><b>${esc(e.prenom)} ${esc(e.nom)}</b><br><span class="muted mono" style="font-size:.8rem">${esc(e.identifiant)}</span></td>
    <td><span class="n ${e.points>0?noteCls(e.note20):"z"}">${e.points>0?fmt(e.note20):"–"}</span></td><td>${fmt(e.points)} / ${e.total}</td>
    <td>${e.indices||"–"}</td><td class="${e.correctionsVues?"flag":""}">${e.correctionsVues||"–"}</td><td>${quand(e.derniereActivite)}</td>
    ${e.chapitres.map(x=>`<td><span class="n ${noteCls(x.note20)}">${fmt(x.note20)}</span></td>`).join("")}</tr>`).join("")}</tbody></table></div>
  <p class="legend">Notes sur 20 par chapitre : <span class="n b">&lt; 8</span> <span class="n w">8 à 12</span> <span class="n g">≥ 12</span>. « – » : chapitre pas commencé. Clique sur un élève pour voir le détail question par question.</p>`;
}

function libelle(cle){
  const [,s,i,j]=cle.split(":");
  if(s==="q")return `QCM ${+i+1}`;
  return `${s==="e"?"Ex.":"Pb."} ${+i+1}${j!==undefined?String.fromCharCode(97+ +j):""}`;
}
function vueDetail(){
  const d=etat.detail,b=etat.bilan,e=b.eleves.find(x=>x.id===d.id);
  const parCh={};for(const r of d.lignes)(parCh[r.chapitreId]=parCh[r.chapitreId]||[]).push(r);
  return `<div class="detail"><div class="acts" style="justify-content:space-between"><button class="btn" id="retour">← Retour au bilan</button><span class="muted">Dernière activité : ${quand(e.derniereActivite)}</span></div>
  <h2>${esc(e.prenom)} ${esc(e.nom)} · ${fmt(e.note20)} / 20</h2>
  ${b.chapitres.map(ch=>{const l=(parCh[ch.id]||[]).sort((a,b)=>a.cle.localeCompare(b.cle,undefined,{numeric:true}));const x=e.chapitres.find(y=>y.chapitreId===ch.id);
    if(!l.length)return "";
    return `<div class="card"><div class="acts" style="justify-content:space-between;align-items:baseline"><h3>${ch.ordre}. ${esc(ch.titre)}</h3><span><span class="n ${noteCls(x.note20)}">${fmt(x.note20)}</span> <span class="muted">${fmt(x.points)} / ${ch.total} pts</span></span></div>
    <div class="chips" style="margin-top:10px">${l.map(r=>{
      const cls=r.reussi?(r.points>=1?"ok":"half"):"ko";
      const info=r.reussi?`${fmt(r.points)} pt`:r.correctionVue?"correction vue":r.essaisRates>=3||r.section==="q"?"raté":`${r.essaisRates} essai${r.essaisRates>1?"s":""} raté${r.essaisRates>1?"s":""}`;
      return `<span class="q ${cls}" title="${r.indice?"Indice utilisé":""}">${libelle(r.cle)} · ${info}${r.indice?" · indice":""}</span>`}).join("")}</div></div>`}).join("")||`<div class="card empty">Cet élève n'a encore répondu à aucune question.</div>`}
  </div>`;
}

function vueEleves(){
  const n=etat.nouveaux;
  return `${n?`<div class="pins"><b>Codes de connexion des nouveaux élèves</b><span>Note-les ou imprime-les maintenant : les codes PIN ne seront plus affichés. En cas d'oubli, tu pourras en générer un nouveau.</span>
    <div class="tbl"><table><thead><tr><th class="l">Élève</th><th>Code classe</th><th>Identifiant</th><th>Code PIN</th></tr></thead>
    <tbody>${n.map(e=>`<tr><td class="l">${esc(e.prenom)} ${esc(e.nom)}</td><td class="mono">${esc(etat.classe.code)}</td><td class="mono">${esc(e.identifiant)}</td><td class="mono"><b>${esc(e.pin)}</b></td></tr>`).join("")}</tbody></table></div>
    <div class="acts noprint"><button class="btn" id="copier">Copier la liste</button><button class="btn" id="imprimer">Imprimer</button><button class="btn" id="fermer">J'ai noté les codes</button></div></div>`:""}
  <form class="card add" id="fEleves"><b>Ajouter des élèves</b><label for="lst" class="muted" style="font-size:.88rem">Un élève par ligne : prénom puis nom (ex : <i>Léa Martin</i>). Tu peux coller une liste depuis un tableur.</label>
    <textarea id="lst" placeholder="Léa Martin&#10;Noah Diallo&#10;Inès Benali"></textarea><div class="acts" style="justify-content:space-between"><span class="msg err" id="eMsg"></span><button class="btn primary">Ajouter</button></div></form>
  <div class="tbl"><table><thead><tr><th class="l">Élève</th><th>Identifiant</th><th>Dernière activité</th><th class="l">Actions</th></tr></thead><tbody>
  ${etat.eleves.map(e=>`<tr data-id="${e.id}"><td class="l">${esc(e.prenom)} ${esc(e.nom)}${e.bloque?` <span class="flag" title="Trop de codes PIN faux">bloqué</span>`:""}</td><td class="mono">${esc(e.identifiant)}</td><td>${quand(e.derniereActivite)}</td>
    <td class="l zone"><button class="linkbtn" data-a="pin">Nouveau PIN</button> · <button class="linkbtn" data-a="reset">Effacer ses résultats</button> · <button class="linkbtn muted" data-a="suppr">Retirer</button></td></tr>`).join("")||`<tr><td colspan="4" class="empty">Aucun élève pour l'instant.</td></tr>`}
  </tbody></table></div>`;
}

function vueReglages(c){
  return `<div class="card" style="display:flex;flex-direction:column;gap:10px"><b>Supprimer la classe</b><span class="muted">Supprime la classe, ses ${c.nbEleves} élève${c.nbEleves>1?"s":""} et tous leurs résultats. Cette action est définitive.</span>
  <div class="zone" id="zSuppr"><button class="btn danger" id="supprClasse">Supprimer ${esc(c.nom)}</button></div></div>`;
}

function brancherClasse(c){
  document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{etat.onglet=b.dataset.o;etat.detail=null;rendre()});
  // bilan
  document.querySelectorAll("tr.clic").forEach(tr=>{
    const go=async()=>{try{const lignes=await api("GET",`/api/classes/${c.id}/eleves/${tr.dataset.id}/resultats`);etat.detail={id:+tr.dataset.id,lignes};rendre();window.scrollTo(0,0)}catch(e){$("#contenu").insertAdjacentHTML("afterbegin",`<p class="msg err">${esc(e.message)}</p>`)}};
    tr.onclick=go;tr.onkeydown=e=>{if(e.key==="Enter")go()};
  });
  const ret=$("#retour");if(ret)ret.onclick=()=>{etat.detail=null;rendre()};
  // élèves
  const f=$("#fEleves");
  if(f)f.onsubmit=async e=>{
    e.preventDefault();
    const eleves=$("#lst").value.split(/\r?\n/).map(l=>l.replace(/[\t;,]+/g," ").trim()).filter(Boolean).map(l=>{const p=l.split(/\s+/);return {prenom:p[0],nom:p.slice(1).join(" ")}});
    if(!eleves.length)return;
    const sansNom=eleves.find(x=>!x.nom);if(sansNom){$("#eMsg").textContent=`Il manque le nom de « ${sansNom.prenom} ».`;return}
    try{etat.nouveaux=await api("POST",`/api/classes/${c.id}/eleves`,{eleves});await rafraichir(c.id)}catch(err){$("#eMsg").textContent=err.message}
  };
  const cp=$("#copier");if(cp)cp.onclick=()=>{
    const txt=["Élève\tCode classe\tIdentifiant\tCode PIN",...etat.nouveaux.map(e=>`${e.prenom} ${e.nom}\t${c.code}\t${e.identifiant}\t${e.pin}`)].join("\n");
    navigator.clipboard.writeText(txt).then(()=>cp.textContent="Copié ✓",()=>cp.textContent="Copie impossible");
  };
  const im=$("#imprimer");if(im)im.onclick=()=>window.print();
  const fe=$("#fermer");if(fe)fe.onclick=()=>{etat.nouveaux=null;rendre()};
  document.querySelectorAll("td.zone").forEach(z=>{
    const id=+z.parentElement.dataset.id,e=etat.eleves.find(x=>x.id===id);
    z.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{
      const a=b.dataset.a;
      if(a==="pin"){
        api("POST",`/api/classes/${c.id}/eleves/${id}/pin`).then(r=>{z.innerHTML=`Nouveau PIN de ${esc(e.prenom)} : <b class="mono">${esc(r.pin)}</b> <button class="linkbtn" data-ok>OK</button>`;z.querySelector("[data-ok]").onclick=()=>rafraichir(c.id)}).catch(err=>z.textContent=err.message);
        return;
      }
      const txt=a==="reset"?`Effacer tous les résultats de ${esc(e.prenom)} ? Il pourra tout refaire.`:`Retirer ${esc(e.prenom)} de la classe et supprimer ses résultats ?`;
      z.innerHTML=`<span class="confirm">${txt}<button class="btn danger" data-y>Confirmer</button><button class="linkbtn" data-n>Annuler</button></span>`;
      z.querySelector("[data-n]").onclick=()=>rendre();
      z.querySelector("[data-y]").onclick=async()=>{
        try{await api("DELETE",a==="reset"?`/api/classes/${c.id}/eleves/${id}/resultats`:`/api/classes/${c.id}/eleves/${id}`);await rafraichir(c.id)}catch(err){z.textContent=err.message}
      };
    });
  });
  // classe
  const sc=$("#supprClasse");if(sc)sc.onclick=()=>{
    $("#zSuppr").innerHTML=`<span class="confirm">Supprimer définitivement ${esc(c.nom)} ?<button class="btn danger" id="scOui">Oui, supprimer</button><button class="linkbtn" id="scNon">Annuler</button></span>`;
    $("#scNon").onclick=()=>rendre();
    $("#scOui").onclick=async()=>{try{await api("DELETE",`/api/classes/${c.id}`);etat.classe=null;etat.onglet="bilan";await chargerClasses();rendre()}catch(err){$("#zSuppr").textContent=err.message}};
  };
}

async function rafraichir(id){
  await chargerClasses();
  etat.classe=etat.classes.find(c=>c.id===id)||null;
  const [b,el]=await Promise.all([api("GET",`/api/classes/${id}/bilan`),api("GET",`/api/classes/${id}/eleves`)]);
  etat.bilan=b;etat.eleves=el;rendre();
}

(async()=>{
  if(etat.prof&&API){try{await chargerClasses();if(etat.classes.length)return ouvrirClasse(etat.classes[0].id)}catch(e){}}
  rendre();
})();
</script>
</body>
</html>
